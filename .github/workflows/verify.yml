name: Verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --ignore-scripts --legacy-peer-deps
      - run: npm install --global @earendil-works/pi-coding-agent@1.2.0
      - run: npm run verify
      - run: npm run verify:ui
